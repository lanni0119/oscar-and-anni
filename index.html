    .blessing { margin: 8px 0 22px; color: #cb6b7a; font-size: 36px; font-weight: 600; letter-spacing: 6px; }
    .note { color: #956f79; font-size: 14px; }
    .restart { margin-top: 40px; }
    footer { position: absolute; bottom: 23px; inset-inline: 0; text-align: center; font-size: 9px; letter-spacing: 2px; color: #b8979c; }
